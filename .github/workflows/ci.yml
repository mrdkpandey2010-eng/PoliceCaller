name: UP Police Portal CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Complete Test Suite
        run: npx vitest run

      - name: Test Database Migrations & Seeds
        run: |
          node scripts/migrate.js
          node scripts/seed.js
          node scripts/backup.js

      - name: Build Web Application & PWA
        run: npm run build --workspace=@police-directory/web
