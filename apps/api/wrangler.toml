name = "police-directory-api"
main = "src/index.ts"
compatibility_date = "2026-02-01"

[vars]
APP_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "police_directory_prod"
database_id = "PLACEHOLDER_CLOUDFLARE_D1_DATABASE_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "police-private-storage"

[triggers]
crons = ["0 */6 * * *"]
